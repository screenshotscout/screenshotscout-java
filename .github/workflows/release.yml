# Publishes com.screenshotscout:screenshotscout to Maven Central when a vX.Y.Z tag
# is pushed, then creates the GitHub release from the tag message's body.
#
# Maven Central has no trusted publishing, so this uses secrets in the "release"
# environment: CENTRAL_USERNAME and CENTRAL_PASSWORD (a Central Portal user token),
# MAVEN_GPG_KEY (the armored private signing key, as exported by GnuPG) and
# MAVEN_GPG_PASSPHRASE. The key is imported into the runner's GnuPG and Maven signs
# through GnuPG, with the passphrase passed by the gpg plugin (loopback, no prompt).
# Never pass the GPG key or passphrase to setup-java: that writes the passphrase
# into settings.xml, which the gpg plugin's bestPractices setting rejects.
#
# Running it by hand (Actions > Release > Run workflow) is a dry run: it tests and
# builds the release jars without signing, and never publishes. Give it the new
# version to also check the poms and README. Tick "check credentials" to sign with
# the stored key and check the Central token (uploads nothing).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run only: fail unless the poms and README say this version (for example 1.2.3)"
        required: false
        type: string
      check_credentials:
        description: "Also check the signing key and the Central token in the release environment (publishes nothing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The RSA-4096 signing key 6B4E7D3ACDCCE8CF.
  SIGNING_KEY: 4C91963EE7B914137750303E6B4E7D3ACDCCE8CF

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # verify runs the tests and the Spotless check (Spotless is bound to verify).
      - run: mvn -B verify

      - name: Check that the poms and README have the release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then expected="${GITHUB_REF_NAME#v}"; else expected="$INPUT_VERSION"; fi
          actual="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "pom.xml version: $actual"
          if [[ -z "$expected" ]]; then exit 0; fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::pom.xml says $actual, but the release is $expected."
            exit 1
          fi
          # examples/pom.xml has its own version and its dependency on the SDK; the README has the install snippet.
          if [[ "$(grep -c "<version>$expected</version>" examples/pom.xml)" -lt 2 ]]; then
            echo "::error::examples/pom.xml doesn't use $expected for both its own version and the SDK dependency."
            exit 1
          fi
          if ! grep -q "<version>$expected</version>" README.md; then
            echo "::error::README.md's install snippet doesn't say $expected."
            exit 1
          fi

      - name: Build the examples against this version
        run: |
          mvn -B -q install -DskipTests
          mvn -B -f examples/pom.xml package

      - name: Build the release jars without signing or publishing
        run: mvn -B -P release verify -DskipTests -Dgpg.skip=true

      - name: Read the release notes from the tag
        if: github.event_name == 'push'
        run: |
          # Fetch the tag object itself, so an annotated tag stays annotated.
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::${GITHUB_REF_NAME} isn't an annotated tag, so it has no release notes. Create it with git tag -a."
            exit 1
          fi
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Tag ${GITHUB_REF_NAME} has no release notes. Write them in the tag message, below the subject line."
            exit 1
          fi
          cat release-notes.md

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  # Manual runs only: signs the release jars with the stored key and checks the Central token.
  credentials:
    if: github.event_name == 'workflow_dispatch' && inputs.check_credentials
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Import the signing key into GnuPG
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
        run: |
          printf '%s\n' "$MAVEN_GPG_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long "$SIGNING_KEY"

      - name: Sign the release jars with the stored key (uploads nothing)
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B -P release verify -DskipTests -Dgpg.keyname="$SIGNING_KEY"
          ls target/*.asc

      - name: Check the Central Portal token
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          auth="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          echo "::add-mask::$auth"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $auth" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=com.screenshotscout&name=screenshotscout&version=0.6.0")"
          if [[ "$status" == "200" ]]; then
            echo "The Central Portal accepted the token."
          else
            echo "::error::The Central Portal answered HTTP $status to the token."
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Writes a settings.xml whose "central" server reads the two environment variables below.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Import the signing key into GnuPG
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
        run: |
          printf '%s\n' "$MAVEN_GPG_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long "$SIGNING_KEY"

      # With autoPublish and waitUntil=published in pom.xml, this waits until Maven Central has published it.
      - name: Sign and publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsSI -o /dev/null "https://repo1.maven.org/maven2/com/screenshotscout/screenshotscout/$version/screenshotscout-$version.pom"; then
            echo "com.screenshotscout:screenshotscout:$version is already on Maven Central."
            exit 0
          fi
          mvn -B -P release deploy -DskipTests -Dgpg.keyname="$SIGNING_KEY"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub release for $GITHUB_REF_NAME already exists."
            exit 0
          fi
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Screenshot Scout Java SDK $version" --notes-file release-notes.md "${flags[@]}"

      # Published deployments can take a while to reach repo1.maven.org.
      - name: Wait until Maven Central serves the new version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 120); do
            if curl -fsSI -o /dev/null "https://repo1.maven.org/maven2/com/screenshotscout/screenshotscout/$version/screenshotscout-$version.pom"; then
              echo "com.screenshotscout:screenshotscout:$version is live on Maven Central."
              exit 0
            fi
            sleep 15
          done
          echo "::error::com.screenshotscout:screenshotscout:$version isn't on repo1.maven.org after 30 minutes."
          exit 1
